name: private-n8n
services:
  postgres:
    image: ${POSTGRES_IMAGE:?required}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  tailscale:
    image: ${TAILSCALE_IMAGE:?required}
    pull_policy: never
    restart: unless-stopped
    environment:
      TS_AUTHKEY: file:/run/secrets/enrollment.key
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:?required}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
      - ./enrollment.key:/run/secrets/enrollment.key:ro
      - ./serve.json:/config/serve.json:ro
    networks: [egress, database]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  n8n:
    image: ${N8N_IMAGE:?required}
    pull_policy: never
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      postgres: {condition: service_healthy}
      tailscale: {condition: service_started}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_HOST: ${N8N_FQDN:?required}
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_FQDN:?required}
      WEBHOOK_URL: https://${N8N_FQDN:?required}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
    volumes:
      - n8n:/home/node/.n8n
      - ./workflow.json:/bootstrap/workflow.json:ro
      - ./credentials.json:/bootstrap/credentials.json:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  egress: {}
  database:
    internal: true
volumes:
  postgres: {}
  n8n: {}
  tailscale: {}
